name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GDSaveEditor
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../key.jks
          fi

      - name: Create keystore properties
        if: github.event_name == 'push'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ../key.jks ]; then
            cat > keystore.properties << EOF
          storeFile=../../key.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate version info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version_info
        run: |
          echo "version=$(date +'%Y.%m.%d-%H%M%S')-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version_info.outputs.version }}
          name: Release ${{ steps.version_info.outputs.version }}
          files: GDSaveEditor/app/build/outputs/apk/release/*.apk
