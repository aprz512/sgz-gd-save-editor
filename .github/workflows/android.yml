name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GDSaveEditor
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate version info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version_info
        run: |
          echo "version=$(date +'%Y.%m.%d-%H%M%S')-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version_info.outputs.version }}
          name: Release ${{ steps.version_info.outputs.version }}
          files: GDSaveEditor/app/build/outputs/apk/release/*.apk
